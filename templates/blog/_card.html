<div class="col-md-6 col-lg-4">
  <div class="property-card">
    <div class="thumb">
      <a href="{{ post.get_absolute_url }}">
        {% if post.cover %}<img src="{{ post.cover.url }}" alt="{{ post.title }}" loading="lazy">
        {% else %}<span class="placeholder-icon"><i class="fa-regular fa-newspaper"></i></span>{% endif %}
      </a>
      <div class="badges"><span class="badge badge-purpose">{{ post.get_category_display }}</span></div>
    </div>
    <div class="p-3">
      <div class="small text-muted mb-1">{{ post.created_at|date:"d M Y" }}</div>
      <a href="{{ post.get_absolute_url }}" class="title d-block">{{ post.title }}</a>
      <p class="small text-muted mt-2 mb-0">{{ post.excerpt|default:post.body|truncatewords:22 }}</p>
    </div>
  </div>
</div>
