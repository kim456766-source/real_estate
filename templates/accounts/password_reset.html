{% extends "accounts/_auth_layout.html" %}
{% block auth_content %}
<h3 class="mb-1">Reset password</h3>
<p class="text-muted mb-4">Enter the email address on your account and we'll send you a link to choose a new password.</p>
<form method="post">{% csrf_token %}
  {% include "partials/form_fields.html" with col="col-12" %}
  <button class="btn btn-primary w-100 mt-4">Send reset link</button>
</form>
{% endblock %}
