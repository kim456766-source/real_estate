{% extends "base.html" %}
{% block title %}Please try again{% endblock %}
{% block content %}
<div class="container text-center py-5 my-5">
  <i class="fa-solid fa-rotate fa-4x text-green opacity-50 mb-3"></i>
  <h1>Please try again</h1>
  <p class="text-muted">This page was open too long or your browser blocked cookies, so the form could not be sent safely.<br>
    Go back, refresh the page and send it again.</p>
  <a href="javascript:history.back()" class="btn btn-primary">Go back</a>
  <a href="{% url 'pages:home' %}" class="btn btn-light border ms-2">Home</a>
</div>
{% endblock %}
