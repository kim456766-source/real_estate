# Render Blueprint: Render reads this file from GitHub and creates the website + database.
databases:
  - name: theo-property-db
    plan: free
    databaseName: theo_property
    user: theo

services:
  - type: web
    name: theo-property
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DATABASE_URL
        fromDatabase:
          name: theo-property-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: TRUST_X_FORWARDED_FOR
        value: "True"
      - key: WEB_CONCURRENCY
        value: "2"
      # Filled in by you on the Render dashboard (kept out of GitHub):
      - key: CLOUDINARY_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: LOGIN_ALERT_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
